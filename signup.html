<!DOCTYPE html>
<html>

<head>

    <title>Signup - VowSecure</title>

    <link rel="stylesheet" href="style.css">

    <!-- FONT AWESOME -->

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-left">

            <div class="menu-icon">

                <i class="fa-solid fa-bars"></i>

            </div>

            <h2 class="logo">
                VowSecure
            </h2>

        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="labs.html">
                Labs
            </a>

            <a href="recommend.html">
                Recommendations
            </a>

            <a href="reports.html">
                Reports
            </a>

        </div>

    </nav>



    <!-- SIGNUP SECTION -->

    <div class="recommend-page">

        <div class="recommend-box">

            <h1>
                Create Account
            </h1>

            <p class="recommend-subtitle">

                Join VowSecure to access
                healthcare recommendations,
                nearby labs, doctors,
                and saved reports.

            </p>



            <!-- NAME -->

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                >

            </div>



            <!-- CITY -->

            <div class="form-group">

                <label>
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    placeholder="Enter your city"
                >

            </div>



            <!-- BUTTON -->

            <button onclick="signup()">

                <i class="fa-solid fa-user-plus"></i>

                Create Account

            </button>

            <p id="message"></p>

            <!-- LOGIN -->

            <p class="auth-text">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </div>

    </div>

    <script type="module">

        import { initializeApp }
        
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        
        
        
        import {
        
            getAuth,
        
            createUserWithEmailAndPassword,
        
            signInWithEmailAndPassword
        
        }
        
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        
        
        const firebaseConfig = {
  apiKey: "AIzaSyA8u_Hc_uMqTom7IyEzGcQC2kIwoLqRagY",
  authDomain: "vow-ab245.firebaseapp.com",
  projectId: "vow-ab245",
  storageBucket: "vow-ab245.firebasestorage.app",
  messagingSenderId: "778275601766",
  appId: "1:778275601766:web:b127c8efa5b39bb38c5ca7",
  measurementId: "G-NJ48TZR36M"
};

        
        
        
        const app =
        initializeApp(firebaseConfig);
        
        const auth =
        getAuth(app);
        
        
        
        // SIGNUP
        
        window.signup =
        async function(){
        
            const email =
            document.getElementById(
                "email"
            ).value;
        
        
        
            const password =
            document.getElementById(
                "password"
            ).value;
        
        
        
            try{
        
                await
                createUserWithEmailAndPassword(
        
                    auth,
                    email,
                    password
                );
        
        
        
                alert(
                    "Signup Successful"
                );
        
        
        
                window.location.href =
                "login.html";
            }
        
            catch(error){
        
                alert(error.message);
            }
        };
        
        
        
        // LOGIN
        
        window.login =
        async function(){
        
            const email =
            document.getElementById(
                "email"
            ).value;
        
        
        
            const password =
            document.getElementById(
                "password"
            ).value;
        
        
        
            try{
        
                await
                signInWithEmailAndPassword(
        
                    auth,
                    email,
                    password
                );
        
        
        
                localStorage.setItem(
                    "email",
                    email
                );
        
        
        
                alert(
                    "Login Successful"
                );
        
        
        
                window.location.href =
                "dashboard.html";
            }
        
            catch(error){
        
                alert(error.message);
            }
        };
        
        </script>

    <script src="script.js"></script>
    <script
type="module"
src="firebase.js">
</script>

</body>

</html>
