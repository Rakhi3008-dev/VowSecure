<!DOCTYPE html>
<html>

<head>

    <title>Signup - VowSecure</title>

    <link rel="stylesheet" href="style.css">

    <!-- FONT AWESOME -->

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-left">

            <div class="menu-icon">

                <i class="fa-solid fa-bars"></i>

            </div>

            <h2 class="logo">
                VowSecure
            </h2>

        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="labs.html">
                Labs
            </a>

            <a href="recommend.html">
                Recommendations
            </a>

            <a href="reports.html">
                Reports
            </a>

        </div>

    </nav>



    <!-- SIGNUP SECTION -->

    <div class="recommend-page">

        <div class="recommend-box">

            <h1>
                Create Account
            </h1>

            <p class="recommend-subtitle">

                Join VowSecure to access
                healthcare recommendations,
                nearby labs, doctors,
                and saved reports.

            </p>



            <!-- NAME -->

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                >

            </div>



            <!-- CITY -->

            <div class="form-group">

                <label>
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    placeholder="Enter your city"
                >

            </div>



            <!-- BUTTON -->

            <button onclick="signup()">

                <i class="fa-solid fa-user-plus"></i>

                Create Account

            </button>



            <!-- LOGIN -->

            <p class="auth-text">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
