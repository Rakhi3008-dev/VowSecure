<!DOCTYPE html>
<html>

<head>

    <title>Login - VowSecure</title>

    <link rel="stylesheet" href="style.css">

    <!-- FONT AWESOME -->

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-left">

            <div class="menu-icon">

                <i class="fa-solid fa-bars"></i>

            </div>

            <h2 class="logo">
                VowSecure
            </h2>

        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="labs.html">
                Labs
            </a>

            <a href="recommend.html">
                Recommendations
            </a>

            <a href="reports.html">
                Reports
            </a>

        </div>

    </nav>



    <!-- LOGIN SECTION -->

    <div class="recommend-page">

        <div class="recommend-box">

            <h1>
                Welcome Back
            </h1>

            <p class="recommend-subtitle">

                Login to access your
                healthcare reports,
                recommendations,
                and nearby healthcare services.

            </p>



            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

            </div>



            <!-- LOGIN BUTTON -->

            <button type="button" onclick="login()">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>


            <p id="message"></p>
            <!-- SIGNUP -->

            <p class="auth-text">

                Don’t have an account?

                <a href="signup.html">

                    Create Account

                </a>

            </p>

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
